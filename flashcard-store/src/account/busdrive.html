<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus drive — JongCham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4ED; --sheet:#FFFFFF; --ink:#1C1A15; --body:#4A473F; --muted:#857F73;
    --hair:#E1DBCC; --green:#243529;
    --type:"Courier Prime","Courier New",monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       display:grid;place-items:center;min-height:100vh;padding:24px}
  .wrap{width:min(560px,100%)}
  h1{font-family:var(--type);font-size:20px;letter-spacing:-.03em;margin:0 0 4px}
  .cap{color:var(--muted);font-size:13px;margin:0 0 18px}
  .row{display:flex;gap:10px;margin-top:16px}
  .row button{flex:1;height:48px;border:0;border-radius:999px;cursor:pointer;font:inherit;
    font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    background:var(--sheet);color:var(--green);border:1px solid var(--hair);
    box-shadow:0 4px 0 var(--hair);transition:all .12s cubic-bezier(.2,.7,.2,1)}
  .row button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  .row button.on{background:linear-gradient(#3E8F52,#2C6E3D);color:#fff;
                 border-color:#2C6E3D;box-shadow:0 4px 0 #234F30}

/* ==================================================================
   DRIVE SCENE — copy this block
   ================================================================== */
  .drive{position:relative;width:100%;border-radius:20px;overflow:hidden;
         border:1px solid var(--hair);box-shadow:0 4px 0 var(--hair);background:#CFE3EA}
  .drive svg{display:block;width:100%;height:auto}

  /* every scrolling layer holds two copies side by side and slides one width */
  .band{animation:roll linear infinite}
  @keyframes roll{from{transform:translateX(0)}to{transform:translateX(-400px)}}

  .b-sky   {animation-duration:90s}   /* clouds, barely moving */
  .b-hills {animation-duration:34s}
  .b-far   {animation-duration:19s}   /* tree line */
  .b-near  {animation-duration:7s}    /* grass and bushes at the roadside */
  .b-dash  {animation-duration:1.1s}  /* the centre line of the road */

  .wheel{animation:spin .55s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}

  .bus{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}

  /* one class stops the whole scene */
  .drive.paused .band,
  .drive.paused .wheel,
  .drive.paused .bus{animation-play-state:paused}

  @media (prefers-reduced-motion:reduce){
    .band,.wheel,.bus{animation:none}
  }
/* ================== end of the part you copy ====================== */
</style>
</head>
<body>
<div class="wrap">
  <h1>On the road</h1>
  <p class="cap">Looping scene — the bus stays put, the country moves past it.</p>

  <!-- ===== the scene ===== -->
  <div class="drive" id="drive">
    <svg viewBox="0 35 400 175" role="img" aria-label="A bus driving through the countryside">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#BFDCE8"/><stop offset="1" stop-color="#E4EFE4"/>
        </linearGradient>
        <clipPath id="frame"><rect width="400" height="210"/></clipPath>

        <!-- drawn once, stamped many times -->
        <g id="tree">
          <rect x="-2" y="-2" width="4" height="13" rx="2" fill="#7E6540"/>
          <circle cx="-6" cy="-3" r="7" fill="#4E8C48"/>
          <circle cx="6" cy="-4" r="7.4" fill="#4E8C48"/>
          <circle cx="0" cy="-9" r="9.4" fill="#5EA357"/>
          <circle cx="-2" cy="-15" r="6.2" fill="#72B868"/>
        </g>
        <g id="palm">
          <path d="M0 12 C-2 5 -1 -2 3 -8" stroke="#8A7048" stroke-width="3" fill="none" stroke-linecap="round"/>
          <g transform="translate(3 -8)">
            <g transform="rotate(-105)"><ellipse cx="9" cy="0" rx="10" ry="3.4" fill="#417C44"/></g>
            <g transform="rotate(-45)"><ellipse cx="10" cy="0" rx="11" ry="3.6" fill="#4E9350"/></g>
            <g transform="rotate(10)"><ellipse cx="10" cy="0" rx="11" ry="3.4" fill="#417C44"/></g>
            <g transform="rotate(60)"><ellipse cx="9" cy="0" rx="10" ry="3.6" fill="#4E9350"/></g>
            <circle cx="0" cy="0" r="2.4" fill="#356538"/>
          </g>
        </g>
        <g id="bush">
          <ellipse cx="-7" cy="0" rx="9" ry="6" fill="#5EA357"/>
          <ellipse cx="7" cy="1" rx="8" ry="5.4" fill="#5EA357"/>
          <ellipse cx="0" cy="-4" rx="9.6" ry="7" fill="#72B868"/>
        </g>
        <g id="cloud">
          <ellipse cx="0" cy="0" rx="15" ry="8" fill="#FFFFFF" opacity=".92"/>
          <ellipse cx="-12" cy="3" rx="10" ry="6" fill="#FFFFFF" opacity=".92"/>
          <ellipse cx="12" cy="3" rx="11" ry="6" fill="#FFFFFF" opacity=".92"/>
        </g>
      </defs>

      <g clip-path="url(#frame)">
        <rect width="400" height="210" fill="url(#sky)"/>
        <circle cx="330" cy="36" r="18" fill="#F7D96B"/>

        <!-- clouds -->
        <g class="band b-sky">
          <g><use href="#cloud" x="60" y="34"/><use href="#cloud" x="210" y="22"/>
             <use href="#cloud" x="320" y="48"/></g>
          <g transform="translate(400 0)">
            <use href="#cloud" x="60" y="34"/><use href="#cloud" x="210" y="22"/>
            <use href="#cloud" x="320" y="48"/></g>
        </g>

        <!-- far hills -->
        <g class="band b-hills">
          <g><path d="M0 120 Q60 84 120 118 Q170 92 220 120 Q280 88 340 118 Q370 104 400 120 L400 150 L0 150Z"
                   fill="#8FB08C"/></g>
          <g transform="translate(400 0)">
            <path d="M0 120 Q60 84 120 118 Q170 92 220 120 Q280 88 340 118 Q370 104 400 120 L400 150 L0 150Z"
                  fill="#8FB08C"/></g>
        </g>

        <!-- grass band the tree line stands on -->
        <rect y="132" width="400" height="34" fill="#7FA97E"/>

        <!-- tree line -->
        <g class="band b-far">
          <g><use href="#tree" x="30" y="150" transform="scale(.85)" style="transform-origin:30px 150px"/>
             <use href="#tree" x="110" y="150"/><use href="#palm" x="180" y="150"/>
             <use href="#tree" x="250" y="150"/><use href="#tree" x="330" y="150"/>
             <use href="#bush" x="70" y="158"/><use href="#bush" x="300" y="158"/></g>
          <g transform="translate(400 0)">
             <use href="#tree" x="30" y="150"/><use href="#tree" x="110" y="150"/>
             <use href="#palm" x="180" y="150"/><use href="#tree" x="250" y="150"/>
             <use href="#tree" x="330" y="150"/><use href="#bush" x="70" y="158"/>
             <use href="#bush" x="300" y="158"/></g>
        </g>

        <!-- the road -->
        <rect y="166" width="400" height="30" fill="#6E6A63"/>
        <rect y="166" width="400" height="2.5" fill="#8A867E"/>
        <g class="band b-dash">
          <g><rect x="10" y="180" width="26" height="3" rx="1.5" fill="#F1EDE2"/>
             <rect x="90" y="180" width="26" height="3" rx="1.5" fill="#F1EDE2"/>
             <rect x="170" y="180" width="26" height="3" rx="1.5" fill="#F1EDE2"/>
             <rect x="250" y="180" width="26" height="3" rx="1.5" fill="#F1EDE2"/>
             <rect x="330" y="180" width="26" height="3" rx="1.5" fill="#F1EDE2"/></g>
          <g transform="translate(400 0)">
             <rect x="10" y="180" width="26" height="3" rx="1.5" fill="#F1EDE2"/>
             <rect x="90" y="180" width="26" height="3" rx="1.5" fill="#F1EDE2"/>
             <rect x="170" y="180" width="26" height="3" rx="1.5" fill="#F1EDE2"/>
             <rect x="250" y="180" width="26" height="3" rx="1.5" fill="#F1EDE2"/>
             <rect x="330" y="180" width="26" height="3" rx="1.5" fill="#F1EDE2"/></g>
        </g>

        <!-- foreground verge, rushing past -->
        <rect y="196" width="400" height="14" fill="#5EA357"/>
        <g class="band b-near">
          <g><use href="#bush" x="40" y="204" transform="scale(.7)" style="transform-origin:40px 204px"/>
             <use href="#bush" x="150" y="206"/><use href="#bush" x="270" y="203"/>
             <use href="#bush" x="360" y="206"/></g>
          <g transform="translate(400 0)">
             <use href="#bush" x="40" y="204"/><use href="#bush" x="150" y="206"/>
             <use href="#bush" x="270" y="203"/><use href="#bush" x="360" y="206"/></g>
        </g>

        <!-- ===== the bus ===== -->
        <g transform="translate(112 108)"><g class="bus">
          <ellipse cx="70" cy="82" rx="70" ry="5" fill="rgba(28,26,21,.18)"/>
          <g stroke="#111111" stroke-width="3.4" stroke-linejoin="round">
            <rect x="12" y="4" width="34" height="9" rx="4" fill="#DCEAF4"/>
            <rect x="78" y="4" width="34" height="9" rx="4" fill="#DCEAF4"/>
            <path d="M4 13 h116 q9 0 10 9 l6 44 q1 9 -9 9 H6 q-5 0 -5 -5 V19 q0 -6 3 -6Z" fill="#4E8AD8"/>
            <rect x="10" y="21" width="76" height="26" rx="4" fill="#79D7F0"/>
            <path d="M25 21 v26 M40 21 v26 M55 21 v26 M70 21 v26" stroke-width="2.6"/>
            <path d="M95 21 h24 q6 0 7 6 l3 12 q1 8 -8 8 h-16 q-10 0 -10 -10Z" fill="#79D7F0"/>
            <rect x="0" y="52" width="9" height="9" rx="2.5" fill="#F7C64B"/>
            <rect x="127" y="52" width="9" height="9" rx="2.5" fill="#F7C64B"/>
            <path d="M2 66 h132" stroke-width="3"/>
          </g>
          <g><circle cx="34" cy="70" r="14" fill="#3A3A3A" stroke="#111" stroke-width="3.4"/>
             <circle class="wheel" cx="34" cy="70" r="7.4" fill="#B9B9B9" stroke="#111" stroke-width="2.6"/>
             <circle cx="34" cy="70" r="2.4" fill="#EDEDED"/></g>
          <g><circle cx="106" cy="70" r="14" fill="#3A3A3A" stroke="#111" stroke-width="3.4"/>
             <circle class="wheel" cx="106" cy="70" r="7.4" fill="#B9B9B9" stroke="#111" stroke-width="2.6"/>
             <circle cx="106" cy="70" r="2.4" fill="#EDEDED"/></g>
        </g></g>
      </g>
    </svg>
  </div>

  <div class="row">
    <button id="toggle" class="on">Pause</button>
  </div>
</div>

<script>
  var drive = document.getElementById('drive'), btn = document.getElementById('toggle');
  btn.addEventListener('click', function () {
    var paused = drive.classList.toggle('paused');
    btn.textContent = paused ? 'Drive' : 'Pause';
    btn.classList.toggle('on', !paused);
  });
</script>
</body>
</html>
